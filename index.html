<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2f46d0">
<title>Journalism</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<header class="top" id="top">
  <div class="wrap">
    <div class="r1"><h1>Journalism</h1><span id="stats"></span>
      <button class="btn pri" id="new"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New entry</button></div>
    <div class="r2">
      <div class="search"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search entries, tags, places" autocomplete="off"></div>
      <nav class="tabs" id="tabs">
        <button data-v="entries" aria-current="true">Entries</button>
        <button data-v="calendar">Calendar</button>
        <button data-v="import">Import &amp; backup</button>
      </nav>
    </div>
  </div>
</header>
<main class="wrap"><div class="status" id="status">Opening your journal…</div><div id="main"></div></main>
<button class="fab" id="fab" aria-label="New entry"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="Entry">
  <div class="sh-top"><div class="wrap">
    <button class="iconbtn" id="back" aria-label="Back"><svg class="ico" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>
    <div class="when" id="when"></div>
    <button class="iconbtn" id="star" aria-label="Star entry"><svg class="ico" viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg></button>
    <button class="iconbtn" id="del" aria-label="Delete entry"><svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
    <button class="btn pri" id="mode">Edit</button>
  </div></div>
  <div class="wrap" id="sbody"></div>
</div>

<div class="modal" id="modal" hidden><div role="alertdialog" aria-modal="true">
  <h3 id="m-t"></h3><p id="m-p"></p>
  <div class="acts"><button class="btn" id="m-no">Cancel</button><button class="btn pri" id="m-yes">OK</button></div>
</div></div>
<div id="toast" role="status"></div>

<script src="storage.js"></script>
<script src="app.js"></script>
</body>
</html>
